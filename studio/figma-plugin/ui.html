<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fantay Figma Import</title>
    <style>
      :root { color-scheme: light; --surface: #fff; --text: #181818; --muted: #666; --line: #e5e5e5; --accent: #494bdc; }
      @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --surface: #232323; --text: #f3f3f3; --muted: #b4b4b4; --line: #454545; --accent: #9b9eff; } }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        max-width: 460px;
        padding: 16px;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        color: var(--figma-color-text, var(--text));
        background: var(--figma-color-bg, var(--surface));
        font-size: 13px;
      }
      h1 { font-size: 14px; margin: 0 0 4px; }
      p.lead { margin: 0 0 14px; color: var(--figma-color-text-secondary, var(--muted)); line-height: 1.45; }
      .drop {
        display: block;
        border: 1.5px dashed var(--figma-color-border, var(--line));
        border-radius: 10px;
        padding: 18px 12px;
        text-align: center;
        color: var(--figma-color-text-secondary, var(--muted));
        cursor: pointer;
        transition: border-color 160ms, background 160ms;
      }
      .drop:hover, .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--figma-color-bg, var(--surface))); color: var(--figma-color-text, var(--text)); }
      .drop strong { color: var(--figma-color-text, var(--text)); }
      .or { text-align: center; color: var(--figma-color-text-secondary, var(--muted)); font-size: 11px; margin: 10px 0; }
      textarea {
        width: 100%;
        height: 96px;
        resize: vertical;
        color: var(--figma-color-text, var(--text));
        background: var(--figma-color-bg, var(--surface));
        border: 1px solid var(--figma-color-border, var(--line));
        border-radius: 8px;
        padding: 8px 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button {
        flex: 1;
        height: 34px;
        border-radius: 8px;
        border: 1px solid transparent;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .primary { background: #494bdc; color: #fff; }
      .primary:hover { background: #3d3fb8; }
      .primary:disabled { background: #dbdaf5; color: #54516c; cursor: default; }
      .ghost { background: var(--figma-color-bg, var(--surface)); border-color: var(--figma-color-border, var(--line)); color: var(--figma-color-text, var(--text)); }
      .ghost:hover { background: color-mix(in srgb, var(--accent) 10%, var(--figma-color-bg, var(--surface))); }
      .msg { margin-top: 10px; min-height: 16px; font-size: 12px; }
      .msg[data-kind='ok'] { color: #16a34a; }
      .msg[data-kind='err'] { color: #dc2626; }
      input[type='file'] { display: none; }
      button:focus-visible, textarea:focus-visible, .drop:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }
      ::selection { background: #deddff; color: #181818; }
    </style>
  </head>
  <body>
    <h1>Fantay Figma Import</h1>
    <p class="lead">
      Load an <strong>.od-figma.json</strong> capture from Fantay Clipper or the Library
      (“Download Figma JSON”) to rebuild it as editable layers.
    </p>

    <label class="drop" id="drop">
      Drop or <strong>choose a .od-figma.json file</strong>
      <input id="file" type="file" accept=".json,application/json" />
    </label>

    <label class="or" for="json" style="display:block">Or paste capture JSON</label>
    <textarea id="json" placeholder='{ "version": 1, "root": { … } }'></textarea>

    <div class="row">
      <button class="ghost" id="cancel" type="button">Close</button>
      <button class="primary" id="import" type="button" disabled>Import</button>
    </div>
    <div class="msg" id="msg" role="status"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      let pending = null; // parsed IR awaiting import
      let readingVersion = 0;
      let busy = false;

      function setMsg(text, kind) {
        const el = $('msg');
        el.textContent = text || '';
        el.dataset.kind = kind || '';
      }

      function setBusy(value) {
        busy = value;
        $('file').disabled = value;
        $('json').disabled = value;
        $('import').disabled = value || !pending;
      }

      // --- image-fill normalization --------------------------------------
      //
      // figma.createImage() (used by code.js) only decodes PNG and JPEG, but a
      // web capture's image fills can be SVG, WebP, GIF, AVIF or BMP — Figma
      // rejects those, so on the main thread they would silently drop and the
      // imported layout would be missing logos, icons and hero images.
      //
      // This UI runs in a real browser iframe (Figma desktop is Chromium), so
      // it CAN decode every format an <img> understands and re-encode it to a
      // PNG data URI here, before the IR is posted to the main thread. SVG (a
      // vector) is rasterized at 2x its box for crispness; raster formats are
      // re-encoded at their own pixel size. Anything that fails to decode is
      // dropped so a single bad image can't abort the import.
      const FIGMA_SAFE_IMAGE = /^image\/(png|jpe?g)$/i;
      const MAX_RASTER_DIM = 4096; // Figma image ceiling

      function dataUriMime(uri) {
        const m = /^data:([^;,]+)/.exec(uri || '');
        return m ? m[1] : '';
      }

      // Decode any <img>-renderable data URI and re-encode it as PNG. `boxW/boxH`
      // are the fill's layout box, used to size vectors / dimensionless images.
      function rasterizeToPng(dataUri, boxW, boxH, isVector) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            try {
              let w = img.naturalWidth || 0;
              let h = img.naturalHeight || 0;
              if (!w || !h) {
                w = Math.max(1, Math.round(boxW) || 300);
                h = Math.max(1, Math.round(boxH) || 150);
              }
              const scale = isVector ? 2 : 1; // upscale vectors so they stay crisp
              w = Math.max(1, Math.round(w * scale));
              h = Math.max(1, Math.round(h * scale));
              const longest = Math.max(w, h);
              if (longest > MAX_RASTER_DIM) {
                const r = MAX_RASTER_DIM / longest;
                w = Math.max(1, Math.round(w * r));
                h = Math.max(1, Math.round(h * r));
              }
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/png'));
            } catch {
              resolve(null);
            }
          };
          img.onerror = () => resolve(null);
          img.src = dataUri;
        });
      }

      // Walk the IR and convert every non-PNG/JPEG image fill to PNG in place.
      // Returns { converted, dropped } for the status line.
      async function normalizeImageFills(ir) {
        const tasks = [];
        const walk = (node) => {
          if (!node) return;
          if (Array.isArray(node.fills)) {
            for (const f of node.fills) {
              if (!f || f.type !== 'IMAGE' || typeof f.dataUri !== 'string') continue;
              if (FIGMA_SAFE_IMAGE.test(dataUriMime(f.dataUri))) continue;
              const isVector = /svg/i.test(dataUriMime(f.dataUri));
              tasks.push(
                rasterizeToPng(f.dataUri, node.width, node.height, isVector).then((png) => {
                  if (png) { f.dataUri = png; f.__ok = true; }
                  else { f.__drop = true; }
                }),
              );
            }
          }
          if (Array.isArray(node.children)) node.children.forEach(walk);
        };
        if (ir && ir.root) walk(ir.root);
        await Promise.all(tasks);
        let converted = 0;
        let dropped = 0;
        const prune = (node) => {
          if (!node) return;
          if (Array.isArray(node.fills)) {
            node.fills = node.fills.filter((f) => {
              if (f && f.__ok) { delete f.__ok; converted += 1; return true; }
              if (f && f.__drop) { dropped += 1; return false; }
              return true;
            });
          }
          if (Array.isArray(node.children)) node.children.forEach(prune);
        };
        if (ir && ir.root) prune(ir.root);
        return { converted, dropped };
      }

      function accept(text, label) {
        try {
          const ir = JSON.parse(text);
          if (!ir || !ir.root || typeof ir.root !== 'object' || (ir.version != null && ir.version !== 1)) throw new Error('unsupported capture');
          pending = ir;
          busy = false;
          $('file').disabled = false;
          $('json').disabled = false;
          $('import').disabled = !pending;
          setMsg(`Ready: ${label || (ir.source && ir.source.title) || 'capture'}`, 'ok');
        } catch (e) {
          pending = null;
          $('import').disabled = true;
          setMsg('Choose a .od-figma.json capture exported by Fantay Clipper or the Library.', 'err');
        }
      }

      function readCapture(file) {
        if (busy || !file) return;
        const version = ++readingVersion;
        pending = null;
        $('import').disabled = true;
        if (/\.fig$/i.test(file.name)) {
          setMsg('Open .fig files in Figma or import them into Fantay. This plugin accepts .od-figma.json captures.', 'err');
          return;
        }
        setMsg('Reading capture…');
        const reader = new FileReader();
        reader.onload = () => { if (version === readingVersion) accept(String(reader.result), file.name); };
        reader.onerror = () => { if (version === readingVersion) setMsg('Could not read this file. Choose it again.', 'err'); };
        reader.readAsText(file);
      }

      $('file').addEventListener('change', (event) => {
        readCapture(event.target.files && event.target.files[0]);
        event.target.value = '';
      });

      const drop = $('drop');
      ['dragenter', 'dragover'].forEach((ev) =>
        drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }),
      );
      ['dragleave', 'drop'].forEach((ev) =>
        drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }),
      );
      drop.addEventListener('drop', (event) => {
        readCapture(event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0]);
      });

      $('json').addEventListener('input', (e) => {
        if (busy) return;
        readingVersion += 1;
        const v = e.target.value.trim();
        if (v) accept(v, 'pasted JSON');
        else { pending = null; $('import').disabled = true; setMsg(''); }
      });

      let lastImageStats = null; // { converted, dropped } from the most recent import

      $('import').addEventListener('click', async () => {
        if (!pending || busy) return;
        setBusy(true);
        try {
          setMsg('Preparing images…');
          lastImageStats = await normalizeImageFills(pending);
          setMsg('Importing…');
          parent.postMessage({ pluginMessage: { type: 'import', ir: pending } }, '*');
        } catch (e) {
          setMsg(`Could not prepare images: ${(e && e.message) || e}`, 'err');
          setBusy(false);
        }
      });

      $('cancel').addEventListener('click', () => {
        parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
      });

      window.onmessage = (e) => {
        const m = e.data && e.data.pluginMessage;
        if (!m) return;
        if (m.type === 'done') {
          let note = `Imported “${m.name}”.`;
          if (lastImageStats && lastImageStats.converted) {
            note += ` Converted ${lastImageStats.converted} image${lastImageStats.converted === 1 ? '' : 's'} (SVG/WebP/GIF → PNG).`;
          }
          if (lastImageStats && lastImageStats.dropped) {
            note += ` ${lastImageStats.dropped} image${lastImageStats.dropped === 1 ? '' : 's'} could not be decoded.`;
          }
          setMsg(note, 'ok');
          setBusy(false);
        } else if (m.type === 'error') {
          setMsg(`Failed: ${m.message}`, 'err');
          setBusy(false);
        }
      };
    </script>
  </body>
</html>
