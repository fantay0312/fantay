packages:
  - packages/*
  - apps/*
  - tools/*
  - shells/*
  - native-tool/*
  - e2e

overrides:
  brace-expansion: 5.0.6
  devalue: 5.8.1
  fast-uri: 3.1.2
  hono: 4.12.19
  ip-address: 10.2.0
  postcss: 8.5.15
  protobufjs: 8.4.0
  qs: 6.15.2
  tmp: 0.2.7
  yaml: 2.9.0

# Fantay uses Deep View's standalone core and React entry points. Its DSH
# host peers are only needed by the plugin entry point.
packageExtensions:
  deep-view@0.1.2:
    peerDependencies:
      react: '>=18'
    peerDependenciesMeta:
      '@deepseek-ai/cordis': { optional: true }
      '@deepseek-ai/dsh-llm': { optional: true }
      '@deepseek-ai/dsh-tools': { optional: true }
      '@deepseek-ai/dsh-web': { optional: true }
      react: { optional: true }

onlyBuiltDependencies:
  - better-sqlite3
  - core-js
  - electron
  - electron-winstaller
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp
