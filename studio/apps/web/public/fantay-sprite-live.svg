<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Fantay</title>
  <style>
    /* The sprite waiting: the idle of the startup splash, carried by the image itself. */
    #sprite { animation: bob 3.2s ease-in-out infinite alternate; }
    #capes, #hat { animation: hat-sway 3.2s ease-in-out infinite alternate; transform-origin: 266px 318px; }
    #hat-tip, #orb-halo { animation: tip-sway 3.2s 280ms ease-in-out infinite alternate; transform-origin: 330px 58px; }
    #orb-glow { animation: glow 2.6s ease-in-out infinite alternate; transform-origin: 379px 109px; }
    .star { animation: twinkle 2.4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 50%; }
    .star:nth-child(2n) { animation-delay: 700ms; }
    .star:nth-child(3n) { animation-delay: 1300ms; }
    #under { animation: breathe 3.2s ease-in-out infinite alternate; transform-origin: 266px 304px; }
    #hand-left { animation: hand 3.2s 140ms ease-in-out infinite alternate; }
    #hand-right { animation: hand 3.2s 900ms ease-in-out infinite alternate; }
    #eye-left { transform-origin: 194px 348px; }
    #eye-right { transform-origin: 338px 348px; }
    #eye-left, #eye-right { animation: blink 5.6s 600ms linear infinite; }
    @keyframes bob { from { transform: translateY(7px); } to { transform: translateY(-9px); } }
    @keyframes hat-sway { from { transform: rotate(-1.1deg); } to { transform: rotate(1.3deg); } }
    @keyframes tip-sway { from { transform: rotate(-5deg); } to { transform: rotate(6deg); } }
    @keyframes glow { from { opacity: 1; transform: scale(1); } to { opacity: 0.55; transform: scale(0.84); } }
    @keyframes twinkle { from { opacity: 1; transform: scale(1); } to { opacity: 0.42; transform: scale(0.76); } }
    @keyframes breathe { from { transform: scale(1, 1); } to { transform: scale(1.012, 0.986); } }
    @keyframes hand { from { transform: translate(0px, 0px); } to { transform: translate(-2px, 6px); } }
    @keyframes blink {
      0%, 4% { transform: scaleY(1); } 6% { transform: scaleY(0.06); } 8.6%, 58% { transform: scaleY(1); }
      59.8% { transform: scaleY(0.06); } 61.8% { transform: scaleY(1); } 63.6% { transform: scaleY(0.06); } 66%, 100% { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
