<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Fantay · 分享与评论</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><a class="brand" href="/"><img src="/icon.svg" alt="" width="32" height="32"><span>Fantay</span></a><div class="account"><span id="account-name"></span><button id="login">使用 TokenToSea 登录</button><button id="logout" hidden>退出登录</button></div></header>
<main id="dashboard" hidden><div class="intro"><p class="eyebrow">让作品开启对话</p><h1>分享设计，收集反馈。</h1><p>从 Fantay 工作台发布作品。每一条评论，都能回到设计发生的位置。</p></div><section id="upload-section" class="upload-section" hidden><div><h2>发布一个作品</h2><p class="help">支持 HTML 文件；包含本地图片等资源时，请从工作台分享完整作品。</p></div><label class="upload-control">选择作品<input id="upload-file" type="file" accept=".html,.htm,text/html"></label><button id="upload-publish" disabled>发布分享链接</button></section><section><div class="section-heading"><h2>我的分享</h2><span id="share-count"></span></div><div id="shares" class="share-list"></div></section></main>
<main id="viewer" hidden><div class="viewer-heading"><div><p class="eyebrow">作品分享</p><h1 id="share-title"></h1><p id="share-version"></p></div><a id="download" class="muted" target="_blank" rel="noopener">打开作品</a></div><div class="workbench"><div class="preview"><iframe id="preview" title="分享的设计作品" sandbox="allow-scripts allow-downloads" referrerpolicy="no-referrer"></iframe></div><aside><div class="section-heading"><h2>评论</h2><button id="refresh" class="text-button">刷新</button></div><p class="help">留下反馈，或先在作品上选择一个位置。</p><button id="select" class="secondary">在作品上选择位置</button><div id="target" class="target" hidden></div><form id="comment-form"><label for="note">你的反馈</label><textarea id="note" maxlength="3000" placeholder="描述你希望调整的地方…" rows="4"></textarea><button id="submit" type="submit">发布评论</button></form><div id="comments" class="comments"></div></aside></div></main>
<div id="message" role="status" hidden></div><footer>Fantay · 由 TokenToSea 账号提供身份验证</footer></body></html>
