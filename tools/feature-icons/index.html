<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantay 功能图标</title>
<meta name="description" content="Fantay Studio feature icons: 31 layered icons that change shape on hover, in the Fantay ink for light and dark pages.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one control bar (palette segmented control, demo switch) above an 8-column wall (4 on narrow screens) of large frames, each holding one small icon. A light page, chosen for judging colour; a palette drawn for a dark page (the dark Fantay ink) takes the page dark while it is chosen. */
:root, [data-page="light"] {
  --page: #FFFFFF;
  --frame: #F2F3F5;
  --knob: #FFFFFF;
  --ink: #23262D;
  --sub: #6B707A;
  --track: #EEEFF2;
  --on: #23262D;
  --dot-edge: transparent;
  --font: 'Open Sans', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color-scheme: light;
}
/* Studio's dark tones: the page is --paper, the frames --sidebar, where the dark ink mostly sits. */
[data-page="dark"] {
  --page: #181818;
  --frame: #222222;
  --knob: #343434;
  --ink: #EDEDED;
  --sub: #919191;
  --track: #2A2A2A;
  --on: #6E6E6E;
  /* A hairline inside each swatch dot, so near-black palettes still show on the dark track. */
  --dot-edge: rgba(255, 255, 255, .32);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 13px;
  transition: background-color .46s cubic-bezier(.22, 1, .36, 1), color .46s cubic-bezier(.22, 1, .36, 1);
}
main {
  max-width: 1180px; margin: 0 auto; display: grid; gap: 24px;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }

/* Segmented control */
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 12px; background: var(--track); }
.seg button {
  font: inherit; font-weight: 400; color: var(--sub); background: transparent; border: 0; cursor: pointer;
  height: 30px; padding: 0 12px; border-radius: 9px; display: inline-flex; align-items: center; gap: 7px;
  transition: background-color .16s, color .16s, box-shadow .16s;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-checked="true"] { background: var(--knob); color: var(--ink); box-shadow: 0 1px 2px rgba(20, 24, 32, .12); }
.dots { display: inline-flex; }
.dots i { width: 9px; height: 9px; border-radius: 50%; margin-left: -3px; box-shadow: 0 0 0 1.5px var(--track), inset 0 0 0 1px var(--dot-edge); }
.seg button[aria-checked="true"] .dots i { box-shadow: 0 0 0 1.5px var(--knob), inset 0 0 0 1px var(--dot-edge); }
.dots i:first-child { margin-left: 0; }

/* Switch */
.switch {
  font: inherit; font-weight: 600; color: var(--ink); background: transparent; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; gap: 10px; padding: 4px;
}
.switch .track { position: relative; width: 38px; height: 22px; border-radius: 999px; background: var(--track); transition: background-color .2s; }
.switch .track::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
  background: #FFFFFF; box-shadow: 0 1px 2px rgba(20, 24, 32, .25); transition: transform .28s cubic-bezier(.32, .72, 0, 1);
}
.switch[aria-checked="true"] .track { background: var(--on); }
.switch[aria-checked="true"] .track::after { transform: translateX(16px); }
.seg button:focus-visible, .switch:focus-visible, .tile:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* Wall */
/* Column counts should divide the number of icons, so no row is left short. 31 is prime, so none
   can: 8 columns (4 below 720px) leave the last row one tile short, the fullest a wall can end. */
.grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: clamp(8px, 1.4vw, 16px); }
@media (max-width: 719px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile {
  aspect-ratio: 1; max-width: 100%; border-radius: 14%; background: var(--frame);
  display: grid; place-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background-color .46s cubic-bezier(.22, 1, .36, 1);
}
.ic { width: 28%; display: block; }
.ic svg { width: 100%; height: auto; overflow: visible; display: block; }
.ol { fill: none; stroke-width: 2; }
.ln { fill: none; stroke-width: 1.6; stroke-linecap: round; }
svg text { font-family: var(--font); }
@media (prefers-reduced-motion: reduce) { body, .tile, .switch .track, .switch .track::after, .seg button { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="bar">
    <div class="seg" id="palette" role="radiogroup" aria-label="色板"></div>
    <button class="switch" id="demo" type="button" role="switch" aria-checked="false">演示<span class="track" aria-hidden="true"></span></button>
  </div>
  <div class="grid" id="grid" aria-label="图标"></div>
</main>
<script src="src/engine.js"></script>
<script src="src/icons.js"></script>
<script src="src/app.js"></script>
</body>
</html>
