name: Fantay validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fantay-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Check out Fantay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install project runtimes
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          working_directory: studio
      - name: Install dependencies
        run: mise x -- pnpm install --frozen-lockfile
      - name: Check repository rules
        run: mise x -- pnpm guard
      - name: Check types
        run: mise x -- pnpm typecheck
